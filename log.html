<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | R CULTURE IL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#fff;--ink:#0a0a0a;--muted:#6b6b6b;--line:#e8e8e8;--err:#dc2626;--ok:#16a34a;
  --display:'Anton','Impact','Arial Narrow',sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}

.ticker{background:var(--ink);color:#fff;font-size:12px;letter-spacing:.12em;text-transform:uppercase;overflow:hidden;white-space:nowrap;padding:9px 0}
.ticker span{display:inline-block;padding-left:100%;animation:scroll 22s linear infinite}
@keyframes scroll{to{transform:translateX(-100%)}}

header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.left,.right{display:flex;align-items:center;gap:16px}
.logo{font-family:var(--display);font-size:22px;letter-spacing:.06em;white-space:nowrap}
nav{display:flex;gap:28px;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
nav a{position:relative;padding:4px 0}
nav a::after{content:"";position:absolute;left:0;bottom:0;width:0;height:1px;background:var(--ink);transition:width .25s}
nav a:hover::after,nav a.on::after{width:100%}
.cart{font-size:13px;font-weight:600;letter-spacing:.08em}

.search{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--ink);padding:3px 0;width:130px;transition:width .25s}
.search:focus-within{width:180px}
.search input{border:0;outline:0;background:transparent;font:inherit;font-size:12px;letter-spacing:.06em;width:100%;color:var(--ink);padding:0}
.search input::placeholder{color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.search button{border:0;background:none;padding:0;cursor:pointer;display:flex;color:var(--ink)}
.search svg,.cart-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.cart-btn{position:relative;display:flex;align-items:center;justify-content:center;width:36px;height:36px;border:1.5px solid var(--ink);transition:background .25s,color .25s}
.cart-btn:hover{background:var(--ink);color:#fff}
.cart-btn svg{width:18px;height:18px}
.cart-count{position:absolute;top:-7px;right:-7px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--ink);color:#fff;border:1.5px solid #fff;font-size:10px;font-weight:600;line-height:14px;text-align:center}

/* page title */
.title{max-width:1200px;width:100%;margin:0 auto;padding:64px 24px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
.title h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,8vw,96px);line-height:.95;letter-spacing:.02em;text-transform:uppercase;margin:0}
.title h1 em{font-family:var(--body);font-style:normal;font-size:.3em;color:var(--muted);letter-spacing:.05em;margin-left:12px}
.title p{margin:0;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* auth */
main{flex:1;width:100%;max-width:1200px;margin:0 auto;padding:32px 24px 96px}
.box{max-width:440px}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin-bottom:28px}
.tabs button{background:none;border:0;padding:0 0 12px;cursor:pointer;font:inherit;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);position:relative}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink)}
form{display:grid;gap:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:grid;gap:6px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
input{width:100%;height:46px;padding:0 14px;border:1.5px solid var(--ink);border-radius:0;background:#fff;color:var(--ink);font:inherit;font-size:14px;letter-spacing:normal;text-transform:none;font-weight:400;outline:0}
input:focus{box-shadow:0 0 0 3px rgba(10,10,10,.12)}
.submit{height:46px;margin-top:6px;border:1.5px solid var(--ink);background:var(--ink);color:#fff;font:inherit;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:background .25s,color .25s}
.submit:hover,.submit:focus-visible{background:#fff;color:var(--ink)}
.submit:disabled{opacity:.45;cursor:wait}
.link{justify-self:start;background:none;border:0;padding:0;cursor:pointer;font:inherit;font-size:12px;letter-spacing:.06em;color:var(--muted);text-decoration:underline}
.link:hover{color:var(--ink)}
.msg{min-height:20px;margin:20px 0 0;font-size:13px}
.msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
.hidden{display:none}

footer{border-top:1px solid var(--line);padding:56px 24px 40px}
.foot{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;gap:32px}
.foot .logo{font-size:26px}
.foot p{color:var(--muted);font-size:13px;margin:10px 0 0}
.links{display:flex;gap:28px;flex-wrap:wrap;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.links a:hover{text-decoration:underline}
.copy{max-width:1200px;margin:40px auto 0;font-size:12px;color:var(--muted)}

@media(max-width:640px){
  nav{display:none}
  .bar{padding:12px 16px;gap:10px}
  .left,.right{gap:10px}
  .logo{font-size:18px}
  .search,.search:focus-within{width:90px}
  .title{padding:40px 20px 8px}
  main{padding:24px 20px 64px}
}
@media(prefers-reduced-motion:reduce){.ticker span{animation:none;padding-left:0}}
</style>
</head>
<body>

<div class="ticker"><span>Free Shipping Over ₪350 &nbsp;·&nbsp; New Drops Weekly &nbsp;·&nbsp; Best Quality &nbsp;·&nbsp; Israel's #1 Streetwear</span></div>

<header>
  <div class="bar">
    <div class="left">
      <a class="logo" href="index.html">R CULTURE IL</a>
      <form class="search" id="searchForm" role="search">
        <input type="search" id="q" placeholder="Search" aria-label="Search">
        <button type="submit" aria-label="Search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        </button>
      </form>
    </div>
    <nav>
      <a href="index.html#shop">Shop</a>
      <a href="COL.html">Collection</a>
      <a href="A.html">About</a>
      <a href="SH.html">Shipping</a>
    </nav>
    <div class="right">
      <a class="cart" href="log.html" id="authLink">LOGIN</a>
      <a class="cart-btn" href="cart.html" aria-label="Cart">
        <svg viewBox="0 0 24 24"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
        <span class="cart-count" id="cartCount">0</span>
      </a>
    </div>
  </div>
</header>

<section class="title">
  <h1 id="pageTitle">Login<em>התחברות</em></h1>
  <p>Access your cart &amp; orders</p>
</section>

<main>
  <div class="box">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-login" aria-selected="true">Login</button>
      <button role="tab" id="tab-signup" aria-selected="false">Create account</button>
    </div>

    <form id="login-form" novalidate>
      <label>Email
        <input type="email" id="login-email" autocomplete="email" required>
      </label>
      <label>Password
        <input type="password" id="login-password" autocomplete="current-password" required>
      </label>
      <button class="submit" type="submit">Login</button>
      <button class="link" type="button" id="forgot">Forgot password?</button>
    </form>

    <form id="signup-form" class="hidden" novalidate>
      <div class="row">
        <label>First name
          <input type="text" id="su-first" autocomplete="given-name" required>
        </label>
        <label>Last name
          <input type="text" id="su-last" autocomplete="family-name" required>
        </label>
      </div>
      <label>Email
        <input type="email" id="su-email" autocomplete="email" required>
      </label>
      <label>Password (min. 6 characters)
        <input type="password" id="su-password" autocomplete="new-password" minlength="6" required>
      </label>
      <button class="submit" type="submit">Create account</button>
    </form>

    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </div>
</main>

<footer>
  <div class="foot">
    <div>
      <div class="logo">R CULTURE IL</div>
      <p>Sneakers &amp; Streetwear · Israel</p>
    </div>
    <div class="links">
      <a href="COL.html">Collection</a>
      <a href="SH.html">Shipping</a>
      <a href="A.html">About</a>
      <a href="https://www.instagram.com/rcultureil/" target="_blank" rel="noopener">Instagram</a>
    </div>
  </div>
  <div class="copy">R Culture IL® 2026</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  // ====== CONFIG ======
  const SUPABASE_URL  = "https://syjaeymotxjgxnweciho.supabase.co";
  const SUPABASE_ANON = "PASTE_YOUR_ANON_PUBLIC_KEY_HERE"; // Supabase > Project Settings > API > anon public
  const REDIRECT_AFTER_LOGIN = "index.html";
  // ====================

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  const $ = id => document.getElementById(id);
  const msg = $("msg");
  const say = (text, type = "") => { msg.textContent = text; msg.className = "msg " + type; };

  /* cart count (same localStorage cart as the shop pages) */
  try {
    const c = JSON.parse(localStorage.getItem("rc_cart")) || [];
    $("cartCount").textContent = c.reduce((n, i) => n + i.qty, 0);
  } catch (e) {}

  // Already logged in -> skip this page
  sb.auth.getSession().then(({ data }) => {
    if (data.session) location.replace(REDIRECT_AFTER_LOGIN);
  });

  // Tabs
  function show(which) {
    const login = which === "login";
    $("login-form").classList.toggle("hidden", !login);
    $("signup-form").classList.toggle("hidden", login);
    $("tab-login").setAttribute("aria-selected", login);
    $("tab-signup").setAttribute("aria-selected", !login);
    $("pageTitle").innerHTML = login ? "Login<em>התחברות</em>" : "Sign up<em>הרשמה</em>";
    say("");
  }
  $("tab-login").onclick = () => show("login");
  $("tab-signup").onclick = () => show("signup");

  // Login
  $("login-form").addEventListener("submit", async e => {
    e.preventDefault();
    const email = $("login-email").value.trim();
    const password = $("login-password").value;
    if (!email || !password) return say("Enter your email and password.", "err");
    const btn = e.submitter; btn.disabled = true; say("");
    const { error } = await sb.auth.signInWithPassword({ email, password });
    btn.disabled = false;
    if (error) return say(error.message === "Invalid login credentials" ? "Wrong email or password." : error.message, "err");
    say("Logged in. Redirecting…", "ok");
    location.href = REDIRECT_AFTER_LOGIN;
  });

  // Signup (also writes the row in `profiles`)
  $("signup-form").addEventListener("submit", async e => {
    e.preventDefault();
    const first_name = $("su-first").value.trim();
    const last_name  = $("su-last").value.trim();
    const email      = $("su-email").value.trim();
    const password   = $("su-password").value;
    if (!first_name || !last_name || !email || password.length < 6)
      return say("Fill in every field. Password needs at least 6 characters.", "err");
    const btn = e.submitter; btn.disabled = true; say("");

    const { data, error } = await sb.auth.signUp({
      email, password,
      options: { data: { first_name, last_name } }
    });
    if (error) { btn.disabled = false; return say(error.message, "err"); }

    // A session exists only when email confirmation is OFF
    if (data.session && data.user) {
      const { error: pErr } = await sb.from("profiles").upsert({
        id: data.user.id, first_name, last_name, email
      });
      if (pErr) console.warn("profiles upsert:", pErr.message);
      location.href = REDIRECT_AFTER_LOGIN;
    } else {
      btn.disabled = false;
      say("Check your email to confirm your account, then log in.", "ok");
    }
  });

  // Forgot password
  $("forgot").onclick = async () => {
    const email = $("login-email").value.trim();
    if (!email) return say("Enter your email above, then click again.", "err");
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: location.origin + location.pathname
    });
    error ? say(error.message, "err") : say("Password reset link sent to your email.", "ok");
  };
</script>

<script src="search.js"></script>
</body>
</html>
